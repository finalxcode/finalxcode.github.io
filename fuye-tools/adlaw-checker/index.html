<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>广告法违禁词检测（免费在线自查）- 副业实验账本</title>
<meta name="description" content="免费在线检测文案中的广告法极限词、绝对化用语、收益承诺、医疗功效词和平台引流词，按分类给出依据与替换建议。纯本地运行，不上传文本。">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div class="wrap"><a class="brand" href="../" data-site-name>副业实验账本</a><nav class="nav"><a href="../fee-calculator/">到账计算器</a></nav></div></header>
<main class="wrap">
  <h1>广告法违禁词检测</h1>
  <p class="lead">粘贴你的文案（小红书笔记、公众号文章、商品描述等），一键找出极限词、收益承诺、医疗功效词和站外引流词，并给出替换建议。文本只在你的浏览器里处理，不会上传。</p>

  <div class="card">
    <textarea id="input" placeholder="在这里粘贴要检测的文案……"></textarea>
    <div class="row">
      <button class="primary" id="btn-check">开始检测</button>
      <button id="btn-sample">填入示例</button>
      <button id="btn-clear">清空</button>
      <span class="muted" id="count">0 字</span>
    </div>
    <details style="margin-top:12px">
      <summary>检测范围与自定义词</summary>
      <div id="cats" style="margin-top:8px"></div>
      <div class="field" style="margin-top:8px">
        <label for="custom">自定义风险词（用逗号或换行分隔，保存在本机浏览器）</label>
        <input type="text" id="custom" placeholder="例如：秒回本, 内部渠道">
      </div>
    </details>
  </div>

  <div class="card" id="result" hidden>
    <div id="summary"></div>
    <div class="highlight" id="highlight"></div>
    <div class="row">
      <button id="btn-replace">按建议替换（建议先复制原文备份）</button>
      <button id="btn-copy">复制文本</button>
    </div>
    <div id="groups"></div>
  </div>

  <div class="notice" id="meta"></div>
  <div class="card" style="margin-top:16px">
    <h2 style="font-size:17px;margin:0 0 6px">使用说明</h2>
    <ul class="muted" style="padding-left:18px;margin:0">
      <li>颜色说明：<span class="tag high">高风险</span>广告法明确禁止或高投诉类；<span class="tag medium">中风险</span>需结合语境判断；<span class="tag low">提示</span>平台风控或建议优化。</li>
      <li>“第一步”“保证金”等常见非广告用法已做排除，但仍可能有误报或漏报，请人工复核。</li>
      <li>“站外引流词”只针对小红书、抖音等内容平台的风控，在你自己的网站上一般不受此限制。</li>
    </ul>
  </div>
</main>
<footer id="site-footer"></footer>
<script src="site.js"></script>
<script src="words.js"></script>
<script src="checker-core.js"></script>
<script src="app.js"></script>
</body>
</html>
